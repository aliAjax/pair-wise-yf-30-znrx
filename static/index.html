<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>药物警戒案例台</title>
<style>body{font:15px system-ui;max-width:1080px;margin:40px auto;padding:0 20px;background:#f5f7fa;color:#172033}section{background:white;padding:20px;margin:16px 0;border-radius:12px;box-shadow:0 2px 12px #0001}input,textarea,button{font:inherit;padding:8px;margin:4px}input,textarea{width:70%}button{background:#174ea6;color:white;border:0;border-radius:6px}pre{background:#111827;color:#d1fae5;padding:14px;overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:6px 10px;border-bottom:1px solid #e5e7eb;text-align:left}.late{color:#b3261e;font-weight:600}</style>
<h1>药物警戒案例台</h1><p>标准库 JSON API 概览。请求需带 X-User-Id、X-Role；区域角色还需 X-Region。</p>
<section><h2>快速查看</h2><input id="user" value="global-admin"><input id="role" value="global_admin"><input id="region" placeholder="区域（区域角色必填，如 CN）"><button onclick="load()">刷新案例</button><pre id="out"></pre></section>
<section><h2>随访计划（未关闭任务）</h2><table><thead><tr><th>案例编号</th><th>到期时间</th><th>案例状态</th><th>提醒</th></tr></thead><tbody id="tasks"></tbody></table></section>
<script>
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function load(){
  let h={'X-User-Id':user.value,'X-Role':role.value}
  if(region.value)h['X-Region']=region.value
  let r=await fetch('/api/state',{headers:h})
  let s=await r.json()
  out.textContent=JSON.stringify(s,null,2)
  tasks.innerHTML=(s.followup_tasks||[]).map(t=>`<tr><td>${esc(t.case_no)}</td><td>${esc(t.due_at)}</td><td>${esc(t.case_status)}</td><td>${t.due_at<s.server_time?'<span class=late>已逾期</span>':'待随访'}</td></tr>`).join('')
}
load()
</script>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>药物警戒案例台</title>
<style>body{font:15px system-ui;max-width:1080px;margin:40px auto;padding:0 20px;background:#f5f7fa;color:#172033}section{background:white;padding:20px;margin:16px 0;border-radius:12px;box-shadow:0 2px 12px #0001}input,textarea,button{font:inherit;padding:8px;margin:4px}input,textarea{width:70%}button{background:#174ea6;color:white;border:0;border-radius:6px}pre{background:#111827;color:#d1fae5;padding:14px;overflow:auto}</style>
<h1>药物警戒案例台</h1><p>标准库 JSON API 概览。请求需带 X-User-Id、X-Role；区域角色还需 X-Region。</p>
<section><h2>待随访任务</h2><p>医学裁定后自动排期：严重或死亡 30 天、非严重 90 天；同一案例只有一个未关闭任务，提交随访自动续排下一次。</p><div id="tasks">加载中…</div></section>
<section><h2>快速查看</h2><input id="user" value="global-admin"><input id="role" value="global_admin"><button onclick="load()">刷新案例</button><pre id="out"></pre></section>
<script>
function renderTasks(tasks){
  if(!tasks.length){tasks='暂无待随访任务';document.getElementById('tasks').textContent=tasks;return}
  let rows=tasks.map(t=>`<tr style="${t.overdue?'color:#b91c1c;font-weight:600':''}"><td>${t.case_no}</td><td>${t.serious?'严重':'非严重'}</td><td>${t.due_at}</td><td>${t.overdue?'已逾期':'待随访'}</td></tr>`).join('');
  document.getElementById('tasks').innerHTML=`<table border="1" cellpadding="6" cellspacing="0"><tr><th>案例编号</th><th>严重性</th><th>随访到期</th><th>状态</th></tr>${rows}</table>`;
}
async function load(){let h={'X-User-Id':user.value,'X-Role':role.value};let r=await fetch('/api/state',{headers:h});let data=await r.json();out.textContent=JSON.stringify(data,null,2);renderTasks(data.followup_tasks||[])}
load()
</script>
